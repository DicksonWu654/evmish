name: EVM probe drift

"on":
  workflow_dispatch:
    inputs:
      chains:
        description: Comma-separated registry names to probe
        required: true
        default: ethereum,arbitrum-one,op-mainnet,base,monad,megaeth,zksync-era

permissions:
  contents: read

jobs:
  probe-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out probe kit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run selected read-only probes
        env:
          CHAIN_LIST: ${{ inputs.chains }}
        run: |
          set -eu
          run_date="ci-${GITHUB_RUN_ID}"
          ./probes/run.sh "$run_date" --chains "$CHAIN_LIST"
          python3 scripts/check_ci_drift.py \
            --baseline results/2026-10-18/CI_BASELINE.json \
            --results "results/$run_date" \
            --chains "$CHAIN_LIST"
